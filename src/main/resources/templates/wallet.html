<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="mk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Digital Wallet · Decentralized Auth</title>
    <link rel="stylesheet" href="/css/style.css"/></head>
<body>
<header class="topbar">
    <a class="brand" href="/home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Decentralized Auth</span>
    </a>
    <nav class="topnav">
        <a href="/profile">Профил</a>
        <a href="/requestAccess">Барања</a>
        <a href="/logout" class="topnav-logout">Одјави се</a>
    </nav>
</header>

<main class="page" style="max-width: 620px;">
    <h1>Твојот Digital Wallet</h1>
    <p class="subtitle">Најавен како <strong th:text="${username}" style="color: var(--text);"></strong></p>

    <div id="status" class="alert alert-success" style="display:none;"></div>

    <div class="identity-card">
        <h2>Дигитален идентитет</h2>

        <div class="field-row">
            <span class="field-label">DID</span>
            <span class="field-value" id="didValue">Не е регистриран</span>
        </div>
        <div class="field-row">
            <span class="field-label">Public key</span>
            <span class="field-value" id="algoValue">Нема генериран клуч</span>
        </div>
        <div class="field-row">
            <span class="field-label">Статус</span>
            <span class="field-value">
        <span id="statusValue" class="status-dot is-unregistered">Нерегистриран</span>
      </span>
        </div>

        <div class="actions-row" style="margin-top: 18px;">
            <button id="generateBtn" class="btn btn-primary">Генерирај идентитет</button>
            <button id="downloadBtn" class="btn btn-secondary" disabled>Преземи backup</button>
            <button id="registerBtn" class="btn btn-secondary" disabled>Регистрирај кај серверот</button>
        </div>

        <details>
            <summary>Прикажи детали за public key (JWK)</summary>
            <pre id="publicKeyDisplay">Нема генериран клуч</pre>
        </details>
    </div>
</main>

<script th:inline="javascript">
    const STORAGE_PUBLIC = 'wallet_public_jwk';
    const STORAGE_PRIVATE = 'wallet_private_jwk';
    const existingDid = /*[[${existingDid}]]*/ null;

    async function generateKeyPair() {
        const keyPair = await window.crypto.subtle.generateKey(
            { name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]
        );
        const publicJwk = await window.crypto.subtle.exportKey("jwk", keyPair.publicKey);
        const privateJwk = await window.crypto.subtle.exportKey("jwk", keyPair.privateKey);
        localStorage.setItem(STORAGE_PUBLIC, JSON.stringify(publicJwk));
        localStorage.setItem(STORAGE_PRIVATE, JSON.stringify(privateJwk));
        return { publicJwk, privateJwk };
    }

    function loadStoredKeys() {
        const pub = localStorage.getItem(STORAGE_PUBLIC);
        const priv = localStorage.getItem(STORAGE_PRIVATE);
        return (pub && priv) ? { publicJwk: JSON.parse(pub), privateJwk: JSON.parse(priv) } : null;
    }

    function updateCard(publicJwk, registered) {
        document.getElementById('algoValue').textContent =
            publicJwk ? `${publicJwk.kty} ${publicJwk.crv}` : 'Нема генериран клуч';
        document.getElementById('publicKeyDisplay').textContent =
            publicJwk ? JSON.stringify(publicJwk, null, 2) : 'Нема генериран клуч';

        const statusEl = document.getElementById('statusValue');
        statusEl.textContent = registered ? 'Registered' : 'Нерегистриран';
        statusEl.classList.toggle('is-registered', registered);
        statusEl.classList.toggle('is-unregistered', !registered);

        document.getElementById('didValue').textContent = existingDid || 'Не е регистриран';
        document.getElementById('downloadBtn').disabled = !publicJwk;
        document.getElementById('registerBtn').disabled = !publicJwk || registered;
    }

    function setStatus(message, isError) {
        const el = document.getElementById('status');
        el.textContent = message;
        el.style.display = message ? 'block' : 'none';
        el.className = isError ? 'alert alert-error' : 'alert alert-success';
    }

    document.getElementById('generateBtn').addEventListener('click', async () => {
        try {
            const { publicJwk } = await generateKeyPair();
            updateCard(publicJwk, false);
            setStatus('Нов идентитет генериран и зачуван локално.', false);
        } catch (e) {
            setStatus('Грешка при генерирање: ' + e.message, true);
        }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const priv = localStorage.getItem(STORAGE_PRIVATE);
        if (!priv) return;
        const blob = new Blob([priv], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'wallet-private-key.json';
        a.click();
        URL.revokeObjectURL(url);
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
        const pub = localStorage.getItem(STORAGE_PUBLIC);
        if (!pub) return;
        try {
            const response = await fetch('/wallet/register-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ publicKeyJwk: pub })
            });
            const text = await response.text();
            if (response.ok) {
                setStatus('Успешно регистрирано.', false);
                updateCard(JSON.parse(pub), true);
            } else {
                setStatus('Грешка при регистрација: ' + text, true);
            }
        } catch (e) {
            setStatus('Мрежна грешка: ' + e.message, true);
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const existing = loadStoredKeys();
        if (existing) {
            updateCard(existing.publicJwk, !!existingDid);
            setStatus('Постоечки идентитет вчитан од овој browser.', false);
        }
    });
</script>
</body>
</html>
