<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="mk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Профил · Decentralized Auth</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<header class="topbar">
    <a class="brand" href="/home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Decentralized Auth</span>
    </a>
    <nav class="topnav">
        <a href="/wallet">Wallet</a>
        <a href="/requestAccess">Барања</a>
        <a href="/logout" class="topnav-logout">Одјави се</a>
    </nav>
</header>

<main class="page">
    <h1>Твојот профил</h1>
    <p class="subtitle">Најавен како <strong th:text="${user.username}" style="color: var(--text);"></strong></p>

    <p th:if="${successMessage}" th:text="${successMessage}" class="alert alert-success"></p>
    <p th:if="${errorMessage}" th:text="${errorMessage}" class="alert alert-error"></p>

    <section class="panel">
        <div class="panel-head"><h2>Твоите credentials</h2></div>
        <table class="ledger">
            <tr><th>Тип</th><th>Статус</th><th>Издаден</th><th>Акции</th></tr>
            <tr th:if="${#lists.isEmpty(credentials)}" class="empty-row">
                <td colspan="4">Нема издадени credentials.</td>
            </tr>
            <tr th:each="c : ${credentials}">
                <td th:text="${c.type}"></td>
                <td><span class="pill" th:classappend="${c.status.name() == 'ACTIVE'} ? 'pill-active' : 'pill-revoked'" th:text="${c.status}"></span></td>
                <td class="mono" th:text="${c.issuedAt}"></td>
                <td>
                    <div class="actions-row">
                        <form method="post" action="/profile/delete-credential" style="display:inline">
                            <input type="hidden" name="credentialId" th:value="${c.id}"/>
                            <button type="submit" class="btn btn-danger btn-small">Избриши</button>
                        </form>
                        <form method="post" action="/profile/update-credential" style="display:inline" class="actions-row">
                            <input type="hidden" name="credentialId" th:value="${c.id}"/>
                            <input type="text" name="type" th:value="${c.type}" size="10"/>
                            <button type="submit" class="btn btn-secondary btn-small">Ажурирај</button>
                        </form>
                    </div>
                </td>
            </tr>
        </table>
    </section>

    <section class="panel">
        <div class="panel-head"><h2>Барај нов credential</h2></div>
        <form method="post" action="/profile/request-credential" class="stack">
            <input type="text" name="type" placeholder="Тип на credential" required/>
            <input type="text" name="proofDocumentPath" placeholder="Патека до документ (опционално)"/>
            <button type="submit" class="btn btn-primary">Поднеси барање</button>
        </form>
    </section>

    <section class="panel">
        <div class="panel-head"><h2>Твоите барања</h2></div>
        <table class="ledger">
            <tr><th>Тип</th><th>Статус</th><th>Поднесено</th></tr>
            <tr th:if="${#lists.isEmpty(requests)}" class="empty-row">
                <td colspan="3">Нема поднесени барања.</td>
            </tr>
            <tr th:each="r : ${requests}">
                <td th:text="${r.requestedType}"></td>
                <td>
          <span class="pill"
                th:classappend="${r.status.name() == 'APPROVED'} ? 'pill-active' : (${r.status.name() == 'DENIED'} ? 'pill-revoked' : 'pill-pending')"
                th:text="${r.status}"></span>
                </td>
                <td class="mono" th:text="${r.requestedAt}"></td>
            </tr>
        </table>
    </section>

    <section class="panel">
        <div class="panel-head"><h2>Public key / DID</h2></div>
        <form method="post" action="/profile/update-key" class="stack">
            <textarea name="publicKey" placeholder="Твојот public key" th:text="${user.publicKey}"></textarea>
            <button type="submit" class="btn btn-primary">Зачувај</button>
        </form>
    </section>
</main>
</body>
</html>
