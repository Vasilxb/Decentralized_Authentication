<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Admin — Корисници</title></head>
<body>
<h1>Сите корисници</h1>
<p><a href="/admin/requests">Назад кон барања</a> | <a href="/logout">Одјави се</a></p>
<p th:if="${successMessage}" th:text="${successMessage}" style="color:green"></p>

<table border="1" cellpadding="6">
    <tr><th>Username</th><th>Email</th><th>Улога</th><th>Enabled</th><th>Акции</th></tr>
    <tr th:each="u : ${users}">
        <td th:text="${u.username}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.role}"></td>
        <td th:text="${u.enabled}"></td>
        <td>
            <form method="post" action="/admin/users/suspend" style="display:inline">
                <input type="hidden" name="username" th:value="${u.username}"/>
                <button type="submit">Суспендирај</button>
            </form>
            <form method="post" action="/admin/users/enable" style="display:inline">
                <input type="hidden" name="username" th:value="${u.username}"/>
                <button type="submit">Активирај</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
