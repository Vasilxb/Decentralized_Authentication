<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="mk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Регистрација · Decentralized Auth</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="auth-page">
<main class="auth-shell wide">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>Регистрација</h1>
    <p class="subtitle">Создади сметка за да добиеш свој дигитален идентитет.</p>

    <p th:if="${error}" th:text="${error}" class="alert alert-error"></p>

    <form method="post" action="/register" class="stack">
        <label class="field">
            <span class="field-label">Корисничко име</span>
            <input type="text" name="username" placeholder="на пр. marija.k" required/>
        </label>
        <label class="field">
            <span class="field-label">Целосно име</span>
            <input type="text" name="fullName" placeholder="Марија Костова" required/>
        </label>
        <label class="field">
            <span class="field-label">Датум на раѓање</span>
            <input type="date" name="dob" required/>
        </label>
        <label class="field">
            <span class="field-label">Адреса на живеење</span>
            <input type="text" name="address" placeholder="ул. Партизанска 12, Скопје" required/>
        </label>
        <label class="field">
            <span class="field-label">Email</span>
            <input type="email" name="email" placeholder="marija@example.com" required/>
        </label>
        <label class="field">
            <span class="field-label">Лозинка</span>
            <input type="password" name="password" placeholder="••••••••" required/>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Регистрирај се</button>
    </form>

    <p class="foot-note">Веќе имаш сметка? <a href="/login">Најави се</a></p>
</main>
</body>
</html>
