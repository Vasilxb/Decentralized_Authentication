<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Credential Verifier</title>
    <link rel="stylesheet" href="/css/style.css"/>
</head>

<body>

<h1>Credential Verifier</h1>

<h2>Request Credential</h2>

<form th:action="@{/verify/request}" method="post">

    <div>
        <label>Holder Username:</label>
        <input type="text"
               name="holderUsername"
               required>
    </div>

    <br>

    <div>
        <label>Verifier Name:</label>
        <input type="text"
               name="verifierName"
               required>
    </div>

    <br>

    <div>
        <label>Credential Type:</label>
        <input type="text"
               name="credentialType"
               required>
    </div>

    <br>

    <button type="submit">
        Request Credential
    </button>

</form>


<hr>


<div th:if="${success}">
    <h3 th:text="${success}"></h3>
</div>

<div th:if="${error}">
    <h3 th:text="${error}"></h3>
</div>


<div th:if="${requestId != null}">

    <h2>Check Request</h2>

    <p>
        Request ID:
        <strong th:text="${requestId}"></strong>
    </p>

    <a th:href="@{/verify/status/{id}(id=${requestId})}">
        Check Status
    </a>

</div>


<div th:if="${request != null}">

    <hr>

    <h2>Verification Result</h2>

    <p>
        Status:
        <strong th:text="${status}"></strong>
    </p>

    <p th:if="${credentialType != null}">
        Credential Type:
        <strong th:text="${credentialType}"></strong>
    </p>

    <p><strong>Тип:</strong> <span th:text="${credentialType}"></span></p>
    <p th:if="${description}"><strong>Опис:</strong> <span th:text="${description}"></span></p>

    <p th:if="${status == 'PENDING'}">
        Waiting for holder approval...
    </p>

    <p th:if="${status == 'DENIED'}">
        The holder denied the request.
    </p>

    <p th:if="${valid == true}">
        Credential is valid.
    </p>

    <p th:if="${valid == false and status == 'APPROVED'}">
        Credential is NOT valid.
    </p>

</div>

</body>
</html>
