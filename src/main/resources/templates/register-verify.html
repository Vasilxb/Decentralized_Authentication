<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Потврди email</title>
</head>
<body>
<h1>Потврди го твојот email</h1>
<p>Испративме код на <strong th:text="${email}"></strong> (провери ја конзолата на серверот).</p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>

<form method="post" action="/register/verify">
    <input type="hidden" name="email" th:value="${email}"/>
    <input type="text" name="code" placeholder="6-цифрен код" maxlength="6" required/>
    <button type="submit">Потврди</button>
</form>
</body>
</html>
