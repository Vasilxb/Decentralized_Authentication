<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Admin — Барања</title></head>
<body>
<h1>Pending credential барања</h1>
<p><a href="/admin/users">Управувај со корисници</a> | <a href="/logout">Одјави се</a></p>
<p th:if="${successMessage}" th:text="${successMessage}" style="color:green"></p>
<p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red"></p>
<table border="1" cellpadding="6">
    <tr><th>Holder ID</th><th>Тип</th><th>Документ</th><th>Поднесено</th><th>Акции</th></tr>
    <tr th:each="r : ${requests}">
        <td th:text="${r.holderId}"></td>
        <td th:text="${r.requestedType}"></td>
        <td th:text="${r.proofDocumentPath}"></td>
        <td th:text="${r.requestedAt}"></td>
        <td>
            <form method="post" action="/admin/requests/approve" style="display:inline">
                <input type="hidden" name="requestId" th:value="${r.id}"/>
                <button type="submit">Одобри</button>
            </form>
            <form method="post" action="/admin/requests/deny" style="display:inline">
                <input type="hidden" name="requestId" th:value="${r.id}"/>
                <button type="submit">Одбиј</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
