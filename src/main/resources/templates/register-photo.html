<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Прикачи ID фотографија</h1>
    <p th:if="${rejectionReason}" class="alert alert-error">Претходно одбиено: <span th:text="${rejectionReason}"></span></p>
    <p th:if="${error}" th:text="${error}" class="alert alert-error"></p>
    <form method="post" action="/register/photo" enctype="multipart/form-data">
        <input type="hidden" name="email" th:value="${email}"/>
        <input type="file" name="photo" accept="image/jpeg,image/png" required/>
        <button type="submit" class="btn btn-primary">Прикачи</button>
    </form>
</body>
</html>
